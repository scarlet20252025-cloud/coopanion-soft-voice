name: Build and test
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install build==1.2.2.post1
      - run: python -m pip install -r requirements-native.txt
      - run: python -m unittest discover -s tests
      - run: python -m build
      - run: python scripts/check_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: coopanion-soft-voice-package
          path: dist/*
