name: Native source build
on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/setup_native.py'
      - 'scripts/setup-native.ps1'
      - 'scripts/build_native_windows.ps1'
      - 'evidence/2026-10-12-native/qwentts-experiment.patch'
      - 'evidence/2026-10-12-native/qwentts-kv-context.patch'
      - 'evidence/2026-10-14-compact-native/qwentts-compact-graphs.patch'
      - 'evidence/2026-10-14-text-rows/qwentts-text-rows.patch'
      - 'evidence/2026-10-15-vram/qwentts-progressive-kv.patch'
      - '.github/workflows/native-build.yml'
      - 'native/**'
      - 'scripts/build_native_worker_trial.ps1'
      - 'scripts/check_native_worker_trial.py'
permissions:
  contents: read
jobs:
  native:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Build pinned native engine without GPU inference
        shell: pwsh
        run: ./scripts/setup-native.ps1 -Python (Get-Command python).Source -BuildOnly
      - name: Build experimental worker and check model-free Unicode parity
        shell: pwsh
        run: |
          ./scripts/build_native_worker_trial.ps1 -QwenSource .runtime-native/native/qwentts -Compiler .runtime-native/native/llvm-mingw/llvm-mingw-20261006-ucrt-x86_64/bin/x86_64-w64-mingw32-clang++.exe
          python scripts/check_native_worker_trial.py --exe .runtime/native-worker-trial-build/voice-worker.exe
      - uses: actions/upload-artifact@v4
        with:
          name: native-build-log-and-manifest
          path: |
            .runtime-native/native/qwentts/build-vulkan/CMakeCache.txt
            evidence/2026-10-12-native/manifest.json
