[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "coopanion-soft-voice"
version = "0.5.0"
description = "Fixed-reference Qwen3-TTS speech with continuous PCM playback for Coopanion"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
authors = [{name = "Asryto"}]

[project.scripts]
soft-voice = "coopanion_soft_voice.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
coopanion_soft_voice = ["assets/*.wav", "assets/phrase-cache/*.wav", "assets/phrase-cache/*.json", "licenses/*.txt", "model-manifest.json"]
